<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilotage Robot Niryo</title>
    <!-- Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        /* Boutons colorés personnalisés */
        .btn-color-red    { background-color: #dc3545; color: white; border: none; }
        .btn-color-green  { background-color: #198754; color: white; border: none; }
        .btn-color-blue   { background-color: #0d6efd; color: white; border: none; }
        .btn-color-red:hover   { background-color: #bb2d3b; color: white; }
        .btn-color-green:hover { background-color: #157347; color: white; }
        .btn-color-blue:hover  { background-color: #0b5ed7; color: white; }
        /* Zone de réponse */
        #response-zone {
            min-height: 80px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container mt-5">

        <!-- Titre -->
        <h1 class="mb-3">Pilotage Robot Niryo</h1>

        <!-- Sélecteur de cible : mock ou robot réel -->
        <div class="mb-4">
            <label for="target-select" class="form-label fw-bold">Cible :</label>
            <select id="target-select" class="form-select w-auto d-inline-block">
                {% for key, url in targets.items() %}
                <option value="{{ key }}">{{ key }} — {{ url }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Boutons de commande couleur -->
        <div class="mb-4">
            <h5>Envoyer une commande couleur :</h5>
            <div class="d-flex gap-3 mt-3 flex-wrap">
                <button class="btn btn-color-red btn-lg px-4"
                        onclick="sendColor('red')">
                    Rouge
                </button>
                <button class="btn btn-color-green btn-lg px-4"
                        onclick="sendColor('green')">
                    Vert
                </button>
                <button class="btn btn-color-blue btn-lg px-4"
                        onclick="sendColor('blue')">
                    Bleu
                </button>
            </div>
        </div>

        <!-- Saisie libre (pour tester une couleur invalide) -->
        <div class="mb-4">
            <h5>Saisie libre (test erreur) :</h5>
            <div class="input-group mt-3" style="max-width: 400px;">
                <input type="text" id="custom-color" class="form-control"
                       placeholder="Ex : yellow, orange...">
                <button class="btn btn-outline-secondary"
                        onclick="sendCustomColor()">
                    Envoyer
                </button>
            </div>
        </div>

        <!-- Zone d'affichage de la réponse -->
        <div class="mb-4">
            <h5>Réponse de l'API :</h5>
            <div id="response-zone" class="border rounded p-3 bg-light text-muted">
                En attente d'une commande...
            </div>
        </div>

    </div>

    <!-- JavaScript : appel AJAX vers /send_color -->
    <script>
        /**
         * Récupère la cible sélectionnée dans le menu déroulant.
         */
        function getTarget() {
            return document.getElementById('target-select').value;
        }

        /**
         * Envoie la couleur saisie dans le champ texte libre.
         */
        function sendCustomColor() {
            var input = document.getElementById('custom-color');
            var color = input.value.trim();
            if (!color) return;
            sendColor(color);
        }

        /**
         * Envoie une commande couleur au serveur Flask,
         * qui la relaie à l'API du robot sélectionné.
         */
        function sendColor(color) {
            // Afficher un indicateur de chargement
            var zone = document.getElementById('response-zone');
            zone.textContent = 'Envoi de "' + color + '" en cours...';
            zone.className = 'border rounded p-3 bg-light text-muted';

            // Requête POST vers notre backend Flask
            fetch('/send_color', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ color: color, target: getTarget() })
            })
            .then(function(response) {
                return response.json().then(function(data) {
                    return { status: response.status, body: data };
                });
            })
            .then(function(result) {
                // Afficher la réponse JSON formatée
                var text = 'HTTP ' + result.status + '\n' + JSON.stringify(result.body, null, 2);
                zone.textContent = text;
                // Couleur selon succès ou erreur
                if (result.status >= 200 && result.status < 300) {
                    zone.className = 'border rounded p-3 bg-success bg-opacity-10 text-success';
                } else {
                    zone.className = 'border rounded p-3 bg-danger bg-opacity-10 text-danger';
                }
            })
            .catch(function(err) {
                zone.textContent = 'Erreur réseau : ' + err.message;
                zone.className = 'border rounded p-3 bg-danger bg-opacity-10 text-danger';
            });
        }

        // Permettre l'envoi avec la touche Entrée dans le champ texte
        document.getElementById('custom-color').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendCustomColor();
        });
    </script>
</body>
</html>
